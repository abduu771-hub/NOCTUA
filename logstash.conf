input {
  beats {
    port => 5044
  }
}

filter {

  ##############################################################################
  # STEP 1 — SOURCE SEPARATION
  # Sets [@metadata][source] only — never pollutes the event document.
  # unknown sources are tagged, not dropped.
  ##############################################################################

  if [log][file][path] =~ "auth\.log" {
    mutate { replace => { "[@metadata][source]" => "auth" } }
  } else if [log][file][path] =~ "syslog" {
    mutate { replace => { "[@metadata][source]" => "syslog" } }
  } else if [log][file][path] =~ "nginx/access\.log" {
    mutate { replace => { "[@metadata][source]" => "nginx_access" } }
  } else if [log][file][path] =~ "nginx/error\.log" {
    mutate { replace => { "[@metadata][source]" => "nginx_error" } }
  } else if [log][file][path] =~ "suricata/eve\.json" {
    mutate { replace => { "[@metadata][source]" => "suricata_eve" } }
  } else {
    mutate { add_tag => ["unknown_source"] }
  }

  ##############################################################################
  # STEP 2 — AUTH.LOG PARSING
  ##############################################################################

  if [@metadata][source] == "auth" {

    mutate {
      replace => {
        "[event][dataset]"  => "system.auth"
        "[event][category]" => "authentication"
      }
    }

    # ── 2a. SSH FAILED PASSWORD ───────────────────────────────────────────────
    if [message] =~ /Failed password for/ {
      grok {
        match => {
          "message" => [
            "%{SYSLOGTIMESTAMP:syslog.timestamp} %{HOSTNAME:host.name} %{DATA:process.name}\\[%{NUMBER}\\]: Failed password for invalid user %{USERNAME:[user][name]} from %{IP:[source][ip]} port %{NUMBER} %{GREEDYDATA}",
            "%{SYSLOGTIMESTAMP:syslog.timestamp} %{HOSTNAME:host.name} %{DATA:process.name}\\[%{NUMBER}\\]: Failed password for %{USERNAME:[user][name]} from %{IP:[source][ip]} port %{NUMBER} %{GREEDYDATA}",
            "Failed password for invalid user %{USERNAME:[user][name]} from %{IP:[source][ip]}",
            "Failed password for %{USERNAME:[user][name]} from %{IP:[source][ip]}"
          ]
        }
        tag_on_failure => ["_grokparsefailure_auth_ssh_failed"]
      }
      mutate {
        replace => {
          "[process][name]"   => "sshd"
          "[event][category]" => "authentication"
          "[event][action]"   => "ssh_failed_login"
          "[event][outcome]"  => "failure"
        }
      }
    }

    # ── 2b. SSH ACCEPTED PASSWORD ─────────────────────────────────────────────
    else if [message] =~ /Accepted password for/ {
      grok {
        match => {
          "message" => "%{GREEDYDATA} Accepted password for %{USERNAME:[user][name]} from %{IP:[source][ip]} port %{NUMBER} %{WORD}"
        }
        tag_on_failure => ["_grokparsefailure_auth_ssh_accepted"]
      }
      mutate {
        replace => {
          "[process][name]"   => "sshd"
          "[event][category]" => "authentication"
          "[event][action]"   => "ssh_success_login_password"
          "[event][outcome]"  => "success"
        }
      }
    }

    # ── 2c. SSH ACCEPTED PUBLICKEY ────────────────────────────────────────────
    else if [message] =~ /Accepted publickey for/ {
      grok {
        match => {
          "message" => "%{GREEDYDATA} Accepted publickey for %{USERNAME:[user][name]} from %{IP:[source][ip]} port %{NUMBER}"
        }
        tag_on_failure => ["_grokparsefailure_auth_ssh_pubkey"]
      }
      mutate {
        replace => {
          "[process][name]"   => "sshd"
          "[event][category]" => "authentication"
          "[event][action]"   => "ssh_success_login_key"
          "[event][outcome]"  => "success"
        }
      }
    }

    # ── 2d. PAM AUTH FAILURE ──────────────────────────────────────────────────
    else if [message] =~ /pam_unix/ and [message] =~ /authentication failure/ {
      grok {
        match => {
          "message" => [
            "%{GREEDYDATA}pam_unix\(%{DATA:[process][pam_service]}:auth\): authentication failure[^;]*;\s*logname=%{DATA}\s+uid=%{NUMBER}\s+euid=%{NUMBER}\s+tty=%{DATA}\s+ruser=%{DATA}\s+rhost=%{IP:[source][ip]}\s+user=%{USERNAME:[user][name]}",
            "%{GREEDYDATA}pam_unix\(%{DATA:[process][pam_service]}:auth\): authentication failure[^;]*;\s*logname=%{DATA}\s+uid=%{NUMBER}\s+euid=%{NUMBER}\s+tty=%{DATA}\s+ruser=%{DATA}\s+rhost=%{IP:[source][ip]}",
            "%{GREEDYDATA}pam_unix\(%{DATA:[process][pam_service]}:auth\): authentication failure user=%{USERNAME:[user][name]} rhost=%{IP:[source][ip]}",
            "%{GREEDYDATA}pam_unix\(%{DATA:[process][pam_service]}:auth\): authentication failure user=%{USERNAME:[user][name]}"
          ]
        }
        tag_on_failure => ["_grokparsefailure_auth_pam_failure"]
      }

      if [process][pam_service] {
        grok {
          match => { "[process][pam_service]" => "^%{WORD:[process][name]}" }
          tag_on_failure => []
        }
      }

      if [process][pam_service] =~ /^sudo/ {
        mutate {
          replace => {
            "[event][category]" => "privilege"
            "[event][action]"   => "sudo_failed"
            "[event][outcome]"  => "failure"
          }
          remove_field => ["[process][pam_service]"]
        }
      } else {
        mutate {
          replace => {
            "[event][category]" => "authentication"
            "[event][action]"   => "pam_auth_failure"
            "[event][outcome]"  => "failure"
          }
          remove_field => ["[process][pam_service]"]
        }
      }
    }

    # ── 2e. PAM SESSION OPEN ──────────────────────────────────────────────────
    else if [message] =~ /pam_unix/ and [message] =~ /session opened/ {
      grok {
        match => {
          "message" => "%{GREEDYDATA}pam_unix\(%{DATA:[process][pam_service]}:session\): session opened for user %{USERNAME:[user][name]}"
        }
        tag_on_failure => ["_grokparsefailure_auth_pam_session_open"]
      }

      if [process][pam_service] =~ /^sudo/ {
        mutate {
          add_tag      => ["noise"]
          remove_field => ["[process][pam_service]"]
        }
      } else {
        if [process][pam_service] {
          grok {
            match => { "[process][pam_service]" => "^%{WORD:[process][name]}" }
            tag_on_failure => []
          }
        }
        mutate {
          replace => {
            "[event][category]" => "session"
            "[event][action]"   => "session_open"
            "[event][outcome]"  => "success"
          }
          remove_field => ["[process][pam_service]"]
        }
      }
    }

    # ── 2f. PAM SESSION CLOSE ─────────────────────────────────────────────────
    else if [message] =~ /pam_unix/ and [message] =~ /session closed/ {
      grok {
        match => {
          "message" => "%{GREEDYDATA}pam_unix\(%{DATA:[process][pam_service]}:session\): session closed for user %{USERNAME:[user][name]}"
        }
        tag_on_failure => ["_grokparsefailure_auth_pam_session_close"]
      }

      if [process][pam_service] =~ /^sudo/ {
        mutate {
          add_tag      => ["noise"]
          remove_field => ["[process][pam_service]"]
        }
      } else {
        if [process][pam_service] {
          grok {
            match => { "[process][pam_service]" => "^%{WORD:[process][name]}" }
            tag_on_failure => []
          }
        }
        mutate {
          replace => {
            "[event][category]" => "session"
            "[event][action]"   => "session_close"
            "[event][outcome]"  => "success"
          }
          remove_field => ["[process][pam_service]"]
        }
      }
    }

    # ── 2g. SUDO COMMAND EXECUTION ────────────────────────────────────────────
    else if [message] =~ /sudo:/ and [message] =~ /USER=/ and [message] =~ /COMMAND=/ {
      grok {
        match => {
          "message" => "%{GREEDYDATA}sudo:\s+%{USERNAME:[user][name]}\s*:.*?USER=%{USERNAME:[user][effective][name]}\s*;\s*COMMAND=%{GREEDYDATA:[process][command_line]}"
        }
        tag_on_failure => ["_grokparsefailure_auth_sudo"]
      }
      mutate {
        replace => {
          "[process][name]"   => "sudo"
          "[event][category]" => "privilege"
          "[event][action]"   => "sudo_command"
          "[event][outcome]"  => "success"
        }
      }
    }

    # ── 2g2. SUDO FAILED — explicit line (non-PAM path) ──────────────────────
    else if [message] =~ /sudo:/ and [message] =~ /incorrect password/ {
      grok {
        match => {
          "message" => [
            "%{GREEDYDATA}sudo:\s+%{USERNAME:[user][name]}\s*:%{GREEDYDATA}",
            "%{GREEDYDATA}sudo:%{GREEDYDATA}"
          ]
        }
        tag_on_failure => []
      }
      mutate {
        replace => {
          "[process][name]"   => "sudo"
          "[event][category]" => "privilege"
          "[event][action]"   => "sudo_failed"
          "[event][outcome]"  => "failure"
        }
      }
    }

    # ── 2h. ROOT LOGIN ────────────────────────────────────────────────────────
    else if [message] =~ /ROOT LOGIN/ {
      grok {
        match => {
          "message" => "%{GREEDYDATA}ROOT LOGIN\s+on '%{DATA}'"
        }
        tag_on_failure => ["_grokparsefailure_auth_root_login"]
      }
      mutate {
        replace => {
          "[user][name]"      => "root"
          "[process][name]"   => "login"
          "[event][category]" => "authentication"
          "[event][action]"   => "login"
          "[event][outcome]"  => "success"
        }
      }
    }

    # ── 2i. SSH DISCONNECT / INVALID USER — noise ─────────────────────────────
    else if [message] =~ /Disconnected from/ or [message] =~ /Connection closed by/ or [message] =~ /Invalid user/ {
      mutate { add_tag => ["noise"] }
    }

    # ── 2j. SYSTEMD-LOGIND ────────────────────────────────────────────────────
    else if [message] =~ /systemd-logind/ {
      if [message] =~ /power off/ or [message] =~ /powering down/ or [message] =~ /Power-Off/ {
        mutate {
          replace => {
            "[process][name]"   => "systemd-logind"
            "[event][category]" => "system"
            "[event][action]"   => "shutdown"
            "[event][outcome]"  => "success"
          }
        }
      } else if [message] =~ /New session/ {
        grok {
          match => { "message" => "%{GREEDYDATA}New session %{NUMBER} of user %{USERNAME:[user][name]}" }
          tag_on_failure => []
        }
        mutate {
          replace => {
            "[process][name]"   => "systemd-logind"
            "[event][category]" => "session"
            "[event][action]"   => "session_open"
            "[event][outcome]"  => "success"
          }
        }
      } else {
        mutate {
          replace => {
            "[process][name]"   => "systemd-logind"
            "[event][category]" => "system"
            "[event][action]"   => "logind_event"
            "[event][outcome]"  => "unknown"
          }
        }
      }
    }

    # ── 2k. POLKITD — noise ───────────────────────────────────────────────────
    else if [message] =~ /polkitd/ {
      mutate { add_tag => ["noise"] }
    }

    # ── 2l. PAM MODULE ERRORS — noise ─────────────────────────────────────────
    else if [message] =~ /PAM unable to dlopen/ or [message] =~ /PAM adding faulty/ {
      mutate { add_tag => ["noise"] }
    }

    # ── 2m. CATCH-ALL ──────────────────────────────────────────────────────────
    else {
      mutate {
        add_tag => ["_unclassified"]
      }
    }

  }

  ##############################################################################
  # STEP 3 — SYSLOG PARSING
  ##############################################################################

  else if [@metadata][source] == "syslog" {

    mutate {
      replace => { "[event][dataset]" => "system.syslog" }
    }

    if [message] =~ /systemd-resolved/ or
       [message] =~ /dbus-daemon/       or
       [message] =~ /apt\.systemd/      or
       [message] =~ /PackageKit/        or
       [message] =~ /packagekit/        or
       [message] =~ /apt-daily/         or
       [message] =~ /apt-news/          or
       [message] =~ /esm-cache/         or
       [message] =~ /unattended-upgrade/ {
      mutate { add_tag => ["noise"] }
    }

    if !("noise" in [tags]) {
      grok {
        match => {
          "message" => [
            "%{TIMESTAMP_ISO8601} %{HOSTNAME} %{DATA:[process][name]}\[%{NUMBER}\]:\s+%{GREEDYDATA}",
            "%{TIMESTAMP_ISO8601} %{HOSTNAME} %{DATA:[process][name]}:\s+%{GREEDYDATA}"
          ]
        }
        tag_on_failure => []
      }

      if [message] =~ /power off/ or [message] =~ /powering down/ or [message] =~ /Power-Off/ {
        mutate {
          replace => {
            "[event][category]" => "system"
            "[event][action]"   => "shutdown"
            "[event][outcome]"  => "unknown"
          }
        }
      } else if [message] =~ /Starting / or [message] =~ /Stopping / {
        mutate {
          replace => {
            "[event][category]" => "system"
            "[event][action]"   => "service_change"
            "[event][outcome]"  => "unknown"
          }
        }
      } else if [message] =~ /systemd\[/ {
        mutate {
          replace => {
            "[event][category]" => "system"
            "[event][action]"   => "service_event"
            "[event][outcome]"  => "unknown"
          }
        }
      } else if [message] =~ /CRON/ {
        mutate {
          replace => {
            "[event][category]" => "process"
            "[event][action]"   => "cron"
            "[event][outcome]"  => "unknown"
          }
        }
      } else {
        mutate {
          replace => {
            "[event][category]" => "system"
            "[event][action]"   => "syslog_unclassified"
            "[event][outcome]"  => "unknown"
          }
        }
      }
    }

  }

  ##############################################################################
  # STEP 4 — NGINX ACCESS LOG PARSING
  ##############################################################################

  else if [@metadata][source] == "nginx_access" {

    grok {
      match => {
        "message" => [
          '%{IPV4:client_ip} - %{DATA:remote_user} \[%{HTTPDATE:timestamp}\] "(?:%{WORD:http_method} %{DATA:url_path}(?: HTTP/%{NUMBER:http_version})?)" %{NUMBER:status_code} %{NUMBER:response_bytes} "(?:%{DATA:referrer})" "(?:%{DATA:user_agent})"'
        ]
      }
      tag_on_failure => ["_grokparsefailure_nginx_access"]
    }

    if "_grokparsefailure_nginx_access" not in [tags] {
      mutate {
        rename => {
          "client_ip"      => "[source][ip]"
          "http_method"    => "[http][request][method]"
          "url_path"       => "[url][original]"
          "status_code"    => "[http][response][status_code]"
          "response_bytes" => "[http][response][body][bytes]"
          "referrer"       => "[http][request][referrer]"
          "user_agent"     => "[user_agent][original]"
        }
        add_field => {
          "[process][name]"   => "nginx"
          "[event][dataset]"  => "nginx.access"
          "[event][category]" => "web"
          "[event][action]"   => "web_request"
        }
      }

      if [url][original] =~ "(?i)\.\./|%2f|etc/passwd" {
        mutate { replace => { "[event][action]" => "web_path_traversal_attempt" } }
      } else if [url][original] =~ "(?i)(union(\s|\+)+select|or(\s|\+)+1=1|sleep\(|information_schema)" {
        mutate { replace => { "[event][action]" => "web_sql_injection_attempt" } }
      } else if [url][original] =~ "(?i)<script|javascript:|onerror=|alert\(" {
        mutate { replace => { "[event][action]" => "web_xss_attempt" } }
      } else if [url][original] =~ "(?i)\.env|wp-config\.php|\.git|backup\.zip|dump\.sql" {
        mutate { replace => { "[event][action]" => "web_sensitive_file_probe" } }
      } else if [http][response][status_code] == "404" {
        mutate { replace => { "[event][action]" => "web_404" } }
      }

      if [event][action] in ["web_path_traversal_attempt","web_sql_injection_attempt","web_xss_attempt","web_sensitive_file_probe","web_404"] {
        mutate { add_tag => ["ready_for_detection"] }
      }
    }

  }

  ##############################################################################
  # STEP 5 — SURICATA EVE.JSON PARSING
  ##############################################################################

  else if [@metadata][source] == "suricata_eve" {

    # ── 5a. Parse JSON from message ───────────────────────────────────────────
    json {
      source         => "message"
      target         => "suricata"
      tag_on_failure => ["_jsonparsefailure_suricata_eve", "_parse_failed"]
    }

    # Only normalize if JSON parsed successfully
    if "_jsonparsefailure_suricata_eve" not in [tags] {

      # ── 5b. Base fields for ALL valid Suricata events ─────────────────────
      mutate {
        replace => {
          "[event][dataset]"  => "suricata.eve"
          "[event][category]" => "network"
          "[process][name]"   => "suricata"
        }
      }

      # ── 5c. @timestamp from Suricata's own timestamp field ────────────────
      if [suricata][timestamp] {
        date {
          match          => [ "[suricata][timestamp]", "ISO8601" ]
          target         => "@timestamp"
          tag_on_failure => ["_suricata_date_parse_failure"]
        }
      }

      # ── 5d. STATS events — keep tiny health summary, drop the blob ────────
      if [suricata][event_type] == "stats" {

        mutate {
          replace => {
            "[event][action]" => "suricata_stats"
            "[event][kind]"   => "metric"
          }
          add_field => {
            "[event][type]" => "info"
          }
          add_tag => ["noise", "noise_suricata_stats"]
        }

        # Extract the only fields worth keeping from the massive stats object
        # before we discard everything else
        ruby {
          code => "
            stats = event.get('[suricata][stats]')
            if stats
              uptime    = stats['uptime']
              capture   = stats['capture']   || {}
              detect    = stats['detect']    || {}
              engines   = detect['engines']
              rules_loaded = (engines.is_a?(Array) && !engines.empty?) ? engines[0]['rules_loaded'] : nil
              event.set('[suricata][health][uptime_seconds]',      uptime)
              event.set('[suricata][health][kernel_packets]',      capture['kernel_packets'])
              event.set('[suricata][health][kernel_drops]',        capture['kernel_drops'])
              event.set('[suricata][health][detect_alerts_total]', detect['alert'])
              event.set('[suricata][health][rules_loaded]',        rules_loaded)
            end
          "
        }

        # Drop the huge stats blob — we have what we need above
        mutate {
          remove_field => ["[suricata][stats]"]
        }

      }

      # ── 5e. FLOW events ────────────────────────────────────────────────────
      else if [suricata][event_type] == "flow" {

        mutate {
          replace => {
            "[event][action]" => "network_flow"
            "[event][kind]"   => "event"
          }
          add_field => {
            "[event][type]" => "connection"
          }
        }

        # Common ECS network fields
        if [suricata][src_ip]   { mutate { copy => { "[suricata][src_ip]"   => "[source][ip]" } } }
        if [suricata][dest_ip]  { mutate { copy => { "[suricata][dest_ip]"  => "[destination][ip]" } } }
        if [suricata][in_iface] { mutate { copy => { "[suricata][in_iface]" => "[observer][ingress][interface][name]" } } }

        # Ports — copy then convert to integer
        if [suricata][src_port] {
          mutate { copy    => { "[suricata][src_port]"  => "[source][port]" } }
          mutate { convert => { "[source][port]"        => "integer" } }
        }
        if [suricata][dest_port] {
          mutate { copy    => { "[suricata][dest_port]" => "[destination][port]" } }
          mutate { convert => { "[destination][port]"   => "integer" } }
        }

        # Protocol — lowercase; guard against "failed"
        if [suricata][proto] {
          mutate {
            copy      => { "[suricata][proto]" => "[network][transport]" }
            lowercase => [ "[network][transport]" ]
          }
        }

        # app_proto — only map if it is not "failed"
        if [suricata][app_proto] and [suricata][app_proto] != "failed" {
          mutate {
            copy      => { "[suricata][app_proto]" => "[network][protocol]" }
            lowercase => [ "[network][protocol]" ]
          }
        } else if [suricata][app_proto] == "failed" {
          # Keep the original value under suricata.* but do NOT set network.protocol
          mutate { add_tag => ["suricata_proto_unknown"] }
        }

        # Flow counters — copy then convert all to integer
        if [suricata][flow][pkts_toserver] {
          mutate { copy    => { "[suricata][flow][pkts_toserver]" => "[source][packets]" } }
          mutate { convert => { "[source][packets]"               => "integer" } }
        }
        if [suricata][flow][pkts_toclient] {
          mutate { copy    => { "[suricata][flow][pkts_toclient]" => "[destination][packets]" } }
          mutate { convert => { "[destination][packets]"          => "integer" } }
        }
        if [suricata][flow][bytes_toserver] {
          mutate { copy    => { "[suricata][flow][bytes_toserver]" => "[source][bytes]" } }
          mutate { convert => { "[source][bytes]"                  => "integer" } }
        }
        if [suricata][flow][bytes_toclient] {
          mutate { copy    => { "[suricata][flow][bytes_toclient]" => "[destination][bytes]" } }
          mutate { convert => { "[destination][bytes]"             => "integer" } }
        }

        # Flow age — integer
        if [suricata][flow][age] {
          mutate { convert => { "[suricata][flow][age]" => "integer" } }
        }

        # network totals via Ruby (safe addition)
        ruby {
          code => "
            sp = event.get('[source][packets]')
            dp = event.get('[destination][packets]')
            sb = event.get('[source][bytes]')
            db = event.get('[destination][bytes]')
            event.set('[network][packets]', sp.to_i + dp.to_i) if sp || dp
            event.set('[network][bytes]',   sb.to_i + db.to_i) if sb || db
          "
        }

        # Flow reason
        if [suricata][flow][reason] {
          mutate { copy => { "[suricata][flow][reason]" => "[event][reason]" } }
        }

        # ── 5e-i. Broadcast / Multicast tagging ─────────────────────────────
        # IPv4 broadcast (255.255.255.255 or subnet .255)
        if [destination][ip] =~ /\.255$/ or [destination][ip] == "255.255.255.255" {
          mutate { add_tag => ["noise", "noise_broadcast"] }
        }
        # IPv4 multicast (224.0.0.0/4)
        else if [destination][ip] =~ /^2(2[4-9]|3[0-9])\./ {
          mutate { add_tag => ["noise", "noise_multicast"] }
        }
        # IPv6 multicast (ff02::)
        else if [destination][ip] =~ /^[Ff][Ff]0/ {
          mutate { add_tag => ["noise", "noise_multicast"] }
        }

        # ── 5e-ii. Infrastructure protocol tagging ───────────────────────────
        # NTP (port 123)
        if [destination][port] and [destination][port] == 123 {
          mutate { add_tag => ["noise", "noise_infrastructure", "noise_ntp"] }
        }
        # mDNS (port 5353)
        else if [destination][port] and [destination][port] == 5353 {
          mutate { add_tag => ["noise", "noise_infrastructure", "noise_mdns"] }
        }
        # SSDP (port 1900)
        else if [destination][port] and [destination][port] == 1900 {
          mutate { add_tag => ["noise", "noise_infrastructure", "noise_ssdp"] }
        }
        # Spotify Connect / other LAN discovery on 57621
        else if [destination][port] and [destination][port] == 57621 {
          mutate { add_tag => ["noise", "noise_infrastructure"] }
        }
        # Also tag by app_proto name if already identified
        else if [network][protocol] == "ntp" {
          mutate { add_tag => ["noise", "noise_infrastructure", "noise_ntp"] }
        }
        else if [network][protocol] == "mdns" {
          mutate { add_tag => ["noise", "noise_infrastructure", "noise_mdns"] }
        }

      }

      # ── 5f. ALERT events — Suricata IDS signature normalization ────────────
      else if [suricata][event_type] == "alert" {

        mutate {
          replace => {
            "[event][action]"   => "network_ids_alert"
            "[event][kind]"     => "alert"
            "[event][category]" => "network"
            "[event][type]"     => "info"
          }
          add_tag => ["ids_alert"]
        }

        # Common ECS network fields
        if [suricata][src_ip]   { mutate { copy => { "[suricata][src_ip]"   => "[source][ip]" } } }
        if [suricata][dest_ip]  { mutate { copy => { "[suricata][dest_ip]"  => "[destination][ip]" } } }
        if [suricata][in_iface] { mutate { copy => { "[suricata][in_iface]" => "[observer][ingress][interface][name]" } } }

        if [suricata][src_port] {
          mutate { copy    => { "[suricata][src_port]"  => "[source][port]" } }
          mutate { convert => { "[source][port]"        => "integer" } }
        }
        if [suricata][dest_port] {
          mutate { copy    => { "[suricata][dest_port]" => "[destination][port]" } }
          mutate { convert => { "[destination][port]"   => "integer" } }
        }

        if [suricata][proto] {
          mutate {
            copy      => { "[suricata][proto]" => "[network][transport]" }
            lowercase => [ "[network][transport]" ]
          }
        }

        if [suricata][app_proto] and [suricata][app_proto] != "failed" {
          mutate {
            copy      => { "[suricata][app_proto]" => "[network][protocol]" }
            lowercase => [ "[network][protocol]" ]
          }
        } else if [suricata][app_proto] == "failed" {
          mutate { add_tag => ["suricata_proto_unknown"] }
        }

        # IDS rule fields
        if [suricata][alert][signature] {
          mutate { copy => { "[suricata][alert][signature]" => "[rule][name]" } }
        }

        if [suricata][alert][signature_id] {
          mutate { copy    => { "[suricata][alert][signature_id]" => "[rule][id]" } }
          mutate { convert => { "[rule][id]"                      => "integer" } }
          mutate { convert => { "[suricata][alert][signature_id]" => "integer" } }
        }

        if [suricata][alert][gid] {
          mutate { copy    => { "[suricata][alert][gid]" => "[rule][ruleset]" } }
          mutate { convert => { "[rule][ruleset]"        => "integer" } }
          mutate { convert => { "[suricata][alert][gid]" => "integer" } }
        }

        if [suricata][alert][category] {
          mutate { copy => { "[suricata][alert][category]" => "[rule][category]" } }
        }

        if [suricata][alert][severity] {
          mutate { copy    => { "[suricata][alert][severity]" => "[event][severity]" } }
          mutate { convert => { "[event][severity]"           => "integer" } }
          mutate { convert => { "[suricata][alert][severity]" => "integer" } }
        }

        if [suricata][alert][action] {
          mutate { copy => { "[suricata][alert][action]" => "[event][outcome]" } }
        }

        if [suricata][alert][rev] {
          mutate { convert => { "[suricata][alert][rev]" => "integer" } }
        }

        # Flow counters may exist on IDS alerts. Keep originals, only convert types.
        if [suricata][flow][pkts_toserver] {
          mutate { convert => { "[suricata][flow][pkts_toserver]" => "integer" } }
        }
        if [suricata][flow][pkts_toclient] {
          mutate { convert => { "[suricata][flow][pkts_toclient]" => "integer" } }
        }
        if [suricata][flow][bytes_toserver] {
          mutate { convert => { "[suricata][flow][bytes_toserver]" => "integer" } }
        }
        if [suricata][flow][bytes_toclient] {
          mutate { convert => { "[suricata][flow][bytes_toclient]" => "integer" } }
        }

        # Long-term IDS categorization pipeline.
        # Blocking wins: ids_info / ids_low_value always prevent ready_for_detection.
        ruby {
          code => '
            tags = Array(event.get("tags")).compact

            rule_name      = event.get("[rule][name]").to_s
            rule_category  = event.get("[rule][category]").to_s
            signature      = event.get("[suricata][alert][signature]").to_s
            category       = event.get("[suricata][alert][category]").to_s
            metadata       = event.get("[suricata][alert][metadata]") || event.get("[suricata][metadata]")

            metadata_text =
              if metadata.is_a?(Hash)
                metadata.values.flatten.compact.join(" ")
              elsif metadata.is_a?(Array)
                metadata.flatten.compact.join(" ")
              elsif metadata
                metadata.to_s
              else
                ""
              end

            text = "#{rule_name} #{rule_category} #{signature} #{category} #{metadata_text}"
            lower = text.downcase

            tags << "ids_alert"

            if lower =~ /(et info|\binfo\b|not suspicious traffic|informational|generic protocol command decode|misc activity|spotify|p2p client|mdns|ssdp|chromecast|discovery|googlecast|local network|broadcast|multicast)/
              tags << "ids_info"
              tags << "ids_low_value"
            end

            if lower =~ /(malware|trojan|botnet|ransomware|payload|dropper|downloader|exploit kit|implant)/
              tags << "ids_malware"
            end

            if lower =~ /(\bc2\b|\bcnc\b|command and control|callback|beacon|botnet|\brat\b|backdoor|implant)/
              tags << "ids_c2"
            end

            if lower =~ /(exploit|attempted administrator privilege gain|attempted user privilege gain|web application attack|shellcode|remote code execution|\brce\b|sql injection|\bxss\b|traversal|\bcve[-_ ]?\d*|command injection|code execution)/
              tags << "ids_exploit"
            end

            if lower =~ /(scan|nmap|masscan|recon|ping sweep|portscan|port scan|icmp scan|service detection|network trojan was detected|attempted information leak|information leak)/
              tags << "ids_scan"
              tags << "ids_recon"
            end

            if lower =~ /(credential|phishing|password|login|bruteforce|brute force|\bauth\b|suspicious login|credential theft|ftp login|ssh login|cleartext password)/
              tags << "ids_credential"
            end

            if lower =~ /(exfil|exfiltration|data leak|data loss|large upload|suspicious upload|tunneling|dns tunnel|data exfiltration)/
              tags << "ids_exfiltration"
            end

            if lower =~ /(policy|\btor\b|proxy|\bvpn\b|anonymizer|torrent|crypto mining|coinminer|mining|unauthorized|\bp2p\b)/
              tags << "ids_policy"
            end

            if lower =~ /(protocol|malformed|invalid|anomaly|decode|bad traffic|suspicious protocol)/
              tags << "ids_protocol_anomaly"
            end

            severity = event.get("[event][severity]")
            severity_int =
              begin
                Integer(severity)
              rescue
                nil
              end

            case severity_int
            when 1
              event.set("[ids][severity_label]", "critical")
              tags << "ids_severity_critical"
            when 2
              event.set("[ids][severity_label]", "high")
              tags << "ids_severity_high"
            when 3
              event.set("[ids][severity_label]", "medium")
              tags << "ids_severity_medium"
            else
              if severity_int && severity_int >= 4
                event.set("[ids][severity_label]", "low")
                tags << "ids_severity_low"
              else
                event.set("[ids][severity_label]", "unknown")
                tags << "ids_severity_unknown"
              end
            end

            category_tags = tags & [
              "ids_info",
              "ids_low_value",
              "ids_policy",
              "ids_scan",
              "ids_recon",
              "ids_exploit",
              "ids_malware",
              "ids_c2",
              "ids_credential",
              "ids_exfiltration",
              "ids_protocol_anomaly"
            ]

            if tags.include?("ids_alert") && category_tags.empty?
              tags << "ids_unknown"
            end

            event.set("tags", tags.uniq)
          '
        }

      }

      # ── 5g. DNS events ─────────────────────────────────────────────────────
      else if [suricata][event_type] == "dns" {

        mutate {
          replace => {
            "[event][action]" => "network_dns"
            "[event][kind]"   => "event"
          }
          add_field => {
            "[event][type]" => "protocol"
          }
        }

        if [suricata][src_ip]  { mutate { copy => { "[suricata][src_ip]"  => "[source][ip]" } } }
        if [suricata][dest_ip] { mutate { copy => { "[suricata][dest_ip]" => "[destination][ip]" } } }

        if [suricata][dns][rrname] { mutate { copy => { "[suricata][dns][rrname]" => "[dns][question][name]" } } }
        if [suricata][dns][rrtype] { mutate { copy => { "[suricata][dns][rrtype]" => "[dns][question][type]" } } }

      }

      # ── 5h. HTTP events ────────────────────────────────────────────────────
      else if [suricata][event_type] == "http" {

        mutate {
          replace => {
            "[event][action]" => "network_http"
            "[event][kind]"   => "event"
          }
          add_field => {
            "[event][type]" => "protocol"
          }
        }

        if [suricata][src_ip]  { mutate { copy => { "[suricata][src_ip]"  => "[source][ip]" } } }
        if [suricata][dest_ip] { mutate { copy => { "[suricata][dest_ip]" => "[destination][ip]" } } }

        if [suricata][http][hostname]        { mutate { copy => { "[suricata][http][hostname]"        => "[url][domain]" } } }
        if [suricata][http][url]             { mutate { copy => { "[suricata][http][url]"             => "[url][original]" } } }
        if [suricata][http][http_method]     { mutate { copy => { "[suricata][http][http_method]"     => "[http][request][method]" } } }
        if [suricata][http][status]          { mutate { copy => { "[suricata][http][status]"          => "[http][response][status_code]" } } }
        if [suricata][http][http_user_agent] { mutate { copy => { "[suricata][http][http_user_agent]" => "[user_agent][original]" } } }

      }

      # ── 5i. TLS events ─────────────────────────────────────────────────────
      else if [suricata][event_type] == "tls" {

        mutate {
          replace => {
            "[event][action]" => "network_tls"
            "[event][kind]"   => "event"
          }
          add_field => {
            "[event][type]" => "protocol"
          }
        }

        if [suricata][src_ip]  { mutate { copy => { "[suricata][src_ip]"  => "[source][ip]" } } }
        if [suricata][dest_ip] { mutate { copy => { "[suricata][dest_ip]" => "[destination][ip]" } } }

        if [suricata][tls][sni] { mutate { copy => { "[suricata][tls][sni]" => "[tls][client][server_name]" } } }

      }

      # ── 5j. Unknown Suricata event_type ────────────────────────────────────
      else {
        mutate { add_tag => ["suricata_unknown_event_type"] }
        if [suricata][event_type] {
          mutate {
            add_field => { "[event][action]" => "suricata_unknown" }
          }
        }
      }

    }
    # end: JSON parsed successfully block

  }
  # end: suricata_eve branch

  ##############################################################################
  # STEP 6 — TIMESTAMP NORMALIZATION (auth + syslog)
  # Suricata uses its own date filter above (5c). This block covers the rest.
  ##############################################################################

  if [@metadata][source] != "suricata_eve" {
    if [message] =~ /^\d{4}-\d{2}-\d{2}T/ {
      date {
        match          => [ "message", "ISO8601" ]
        target         => "@timestamp"
        tag_on_failure => []
      }
    } else if [message] =~ /^[A-Za-z]{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}/ {
      date {
        match          => [ "message", "MMM dd HH:mm:ss", "MMM  d HH:mm:ss" ]
        target         => "@timestamp"
        tag_on_failure => []
      }
    }
  }

  ##############################################################################
  # STEP 7 — PARSE FAILURE HANDLING
  ##############################################################################

  if "_grokparsefailure_auth_ssh_failed"        in [tags] or
     "_grokparsefailure_auth_ssh_accepted"      in [tags] or
     "_grokparsefailure_auth_ssh_pubkey"        in [tags] or
     "_grokparsefailure_auth_pam_failure"       in [tags] or
     "_grokparsefailure_auth_pam_session_open"  in [tags] or
     "_grokparsefailure_auth_pam_session_close" in [tags] or
     "_grokparsefailure_auth_sudo"              in [tags] or
     "_grokparsefailure_auth_root_login"        in [tags] {

    mutate {
      add_tag => ["_parse_failed"]
      replace => {
        "[event][action]"   => "parse_error"
        "[event][outcome]"  => "failure"
        "[event][category]" => "error"
      }
      remove_field => [
        "[user][name]",
        "[user][effective][name]",
        "[source][ip]",
        "[process][name]",
        "[process][command_line]",
        "[process][pam_service]"
      ]
    }
  }

  ##############################################################################
  # STEP 8 — CLEANUP
  ##############################################################################

  mutate {
    remove_field => [
      "[ecs]",
      "[input]",
      "[log][offset]",
      "[log][flags]",
      "[agent][ephemeral_id]",
      "[agent][version]",
      "[agent][type]"
    ]
  }

  ##############################################################################
  # STEP 9 — DETECTION READINESS TAGGING
  # Nginx.access is handled in its own branch above.
  # System/auth/syslog classified, clean, non-noise events get tagged here.
  # Suricata/network useful events get tagged in the dedicated blocks below.
  ##############################################################################

  if [event][action] and
     [event][dataset] != "nginx.access" and
     [event][dataset] != "suricata.eve" and
     !("noise"          in [tags]) and
     !("_parse_failed"  in [tags]) and
     !("_unclassified"  in [tags]) and
     !("unknown_source" in [tags]) {
    mutate { add_tag => ["ready_for_detection"] }
  }

  ##############################################################################
  # STEP 9b — SURICATA CLEAN NETWORK TELEMETRY READINESS
  # Applies only to network_flow, network_dns, network_http, and network_tls.
  # network_ids_alert is intentionally excluded and handled by STEP 9c.
  ##############################################################################

  if [event][dataset] == "suricata.eve" and
     [event][action] in ["network_flow", "network_dns", "network_http", "network_tls"] and
     !("ready_for_detection"    in [tags]) and
     !("noise"                  in [tags]) and
     !("noise_suricata_stats"   in [tags]) and
     !("noise_infrastructure"   in [tags]) and
     !("noise_ntp"              in [tags]) and
     !("noise_mdns"             in [tags]) and
     !("noise_ssdp"             in [tags]) and
     !("noise_broadcast"        in [tags]) and
     !("noise_multicast"        in [tags]) and
     !("_parse_failed"          in [tags]) and
     !("_unclassified"          in [tags]) and
     !("unknown_source"         in [tags]) {
    mutate { add_tag => ["ready_for_detection"] }
  }

  ##############################################################################
  # STEP 9c — SURICATA IDS ALERT READINESS
  # Blocking wins: ids_info / ids_low_value always block ready_for_detection,
  # even when the alert also matches ids_policy or another useful category.
  ##############################################################################

  if [event][dataset] == "suricata.eve" and
     [event][action] == "network_ids_alert" and
     !("ready_for_detection"    in [tags]) and
     !("ids_info"               in [tags]) and
     !("ids_low_value"          in [tags]) and
     !("noise"                  in [tags]) and
     !("noise_suricata_stats"   in [tags]) and
     !("noise_infrastructure"   in [tags]) and
     !("noise_ntp"              in [tags]) and
     !("noise_mdns"             in [tags]) and
     !("noise_ssdp"             in [tags]) and
     !("noise_broadcast"        in [tags]) and
     !("noise_multicast"        in [tags]) and
     !("_parse_failed"          in [tags]) and
     !("_unclassified"          in [tags]) and
     !("unknown_source"         in [tags]) and
     (
       "ids_malware"           in [tags] or
       "ids_c2"                in [tags] or
       "ids_exploit"           in [tags] or
       "ids_scan"              in [tags] or
       "ids_recon"             in [tags] or
       "ids_credential"        in [tags] or
       "ids_exfiltration"      in [tags] or
       "ids_policy"            in [tags] or
       "ids_protocol_anomaly"  in [tags]
     ) {
    mutate { add_tag => ["ready_for_detection"] }
  }

  if [event][dataset] == "suricata.eve" and
     [event][action] == "network_ids_alert" and
     !("ready_for_detection"    in [tags]) and
     !("ids_info"               in [tags]) and
     !("ids_low_value"          in [tags]) and
     !("noise"                  in [tags]) and
     !("noise_suricata_stats"   in [tags]) and
     !("noise_infrastructure"   in [tags]) and
     !("noise_ntp"              in [tags]) and
     !("noise_mdns"             in [tags]) and
     !("noise_ssdp"             in [tags]) and
     !("noise_broadcast"        in [tags]) and
     !("noise_multicast"        in [tags]) and
     !("_parse_failed"          in [tags]) and
     !("_unclassified"          in [tags]) and
     !("unknown_source"         in [tags]) and
     "ids_unknown"              in [tags] and
     (
       "ids_severity_critical"  in [tags] or
       "ids_severity_high"      in [tags]
     ) {
    mutate { add_tag => ["ready_for_detection"] }
  }

}

##############################################################################
# OUTPUT
# _parse_failed   → siem-parse-errors-*
# _unclassified   → siem-unclassified-*
# everything else → siem-raw-*
##############################################################################

output {
  if "_parse_failed" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "siem-parse-errors-%{+YYYY.MM.dd}"
    }
  } else if "_unclassified" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "siem-unclassified-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "siem-raw-%{+YYYY.MM.dd}"
    }
  }

  # Uncomment for debug:
  # stdout { codec => rubydebug }
}